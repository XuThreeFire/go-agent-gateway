# 独立、可丢弃的集成测试环境，不绑定宿主端口，不复用开发数据库卷。
name: go-agent-gateway-tests
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local-test-only
      MYSQL_DATABASE: go_agent_gateway_test
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -u root --silent']
      interval: 3s
      timeout: 3s
      retries: 40
  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./backend/migrations:/migrations:ro
    entrypoint: [migrate]
    command: ["-path", "/migrations", "-database", "mysql://root:local-test-only@mysql:3306/go_agent_gateway_test?parseTime=true&loc=UTC", "up"]
    depends_on:
      mysql:
        condition: service_healthy
  tests:
    image: golang:1.26.1-bookworm
    working_dir: /workspace
    environment:
      GATEWAY_TEST_DATABASE_URL: mysql://root:local-test-only@mysql:3306/go_agent_gateway_test?parseTime=true&loc=UTC
      GOCACHE: /cache/build
      GOMODCACHE: /cache/mod
      TMPDIR: /cache/tmp
    volumes:
      - ./:/workspace:ro
      - ./tmp/container-test-cache:/cache
    command: [sh, -c, "mkdir -p /cache/tmp && go test -race -count=1 ./backend/... ./cli/..."]
    depends_on:
      migrate:
        condition: service_completed_successfully
