# Docker 内部同源入口；宿主机端口由 compose.yaml 仅绑定回环。
server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 1m;
 # 在顶层页面导航时发起认证挑战，避免只在 fetch 中收到 401。
 location / {
  auth_request /_gateway_auth;
  try_files $uri $uri/ /index.html;
 }
 location = /_gateway_auth {
  internal;
  proxy_pass http://backend:8080/api/session;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header Host $http_host;
 }
 location /api/ {
  proxy_pass http://backend:8080;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header Connection "";
  proxy_buffering off;
  proxy_cache off;
  proxy_read_timeout 3600s;
 }
 location /healthz { proxy_pass http://backend:8080; }
}
